<title>La Ruta de Oscar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column — slim HUD, a 16:9 canvas stage, a touch pad on phones; question and result cards float over everything. */
:root{
  --night:#14122b; --panel:#1e1b40; --panel-2:#272352; --line:#3d3879;
  --text:#f4f0ff; --muted:#b0abd8; --apple:#ff5d52; --crust:#ffc46b; --leaf:#5ed592; --bad:#ff7a7a; --sky:#4fa3ff;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--night); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--crust);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:10px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brand small{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.prog{flex:1 1 220px;min-width:0;display:grid;gap:4px}
.prog-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.prog-top b{color:var(--text);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--crust),var(--apple));border-radius:99px;transition:width .35s}
.stats{display:flex;align-items:center;gap:14px}
.hearts{display:flex;gap:3px}
.hearts svg{width:22px;height:22px;display:block}
.score{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;min-width:5ch;text-align:right}
.score span{color:var(--muted);font-weight:400;font-size:12px;margin-right:6px;text-transform:uppercase;letter-spacing:.06em}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.ib svg{width:18px;height:18px}

/* Stage */
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b0920;aspect-ratio:16/9;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.hint{font-size:13px;color:var(--muted);text-align:center}
.hint kbd{font-family:var(--font-body);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text)}
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none}
.pad .lr{display:flex;gap:10px}
.tbtn{width:76px;height:64px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;touch-action:none}
.tbtn:active,.tbtn.on{background:var(--panel-2);border-color:var(--crust)}
.tbtn svg{width:28px;height:28px}
.tbtn.jump{width:120px;background:var(--apple);border-color:var(--apple);color:#2a0a0a;font-weight:700;font-family:var(--font-display);font-size:18px}
@media (pointer:coarse),(max-width:720px){.pad{display:flex}.hint{display:none}}

/* Cards */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(10,8,30,.78);z-index:30}
.overlay.on{display:flex}
.card{width:min(100%,720px);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.card.wide{width:min(100%,840px)}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--crust);font-weight:600}
.card h1,.card h2{margin:0;font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
.card h1{font-size:clamp(32px,6vw,46px)}
.card h2{font-size:clamp(24px,4.4vw,32px)}
.card h3{margin:0;font-size:15px;font-family:var(--font-display);font-weight:600}
.card p{margin:0;color:var(--muted);max-width:62ch}
.card p b,.card li b{color:var(--text);font-weight:600}
.card ul{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:11px 18px;font-weight:600}
.btn:hover{border-color:var(--crust)}
.btn.pri{background:var(--apple);border-color:var(--apple);color:#2a0a0a}
.btn.pri:hover{filter:brightness(1.08)}
.cuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.cutbtn{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);display:grid;gap:2px}
.cutbtn:hover{border-color:var(--crust)}
.cutbtn b{font-family:var(--font-display);font-size:15px}
.cutbtn span{font-size:13px;color:var(--muted)}

/* Question */
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.tbar{height:4px;background:var(--panel-2);border-radius:9px;overflow:hidden}
.tbar>i{display:block;height:100%;width:100%;background:var(--crust);transform-origin:left}
.qtext{font-size:clamp(17px,2.6vw,20px);line-height:1.45;font-weight:500;margin:0;max-width:none}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);line-height:1.4}
.opt:not(:disabled):hover{border-color:var(--crust)}
.opt .l{width:28px;height:28px;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--muted)}
.opt:disabled{cursor:default;opacity:.62}
.opt.ok{opacity:1;border-color:var(--leaf);background:rgba(94,213,146,.14)}
.opt.ok .l{background:var(--leaf);border-color:var(--leaf);color:#0b2416}
.opt.no{opacity:1;border-color:var(--bad);background:rgba(255,122,122,.13)}
.opt.no .l{background:var(--bad);border-color:var(--bad);color:#2b0c0c}
.fb{display:grid;gap:10px}
.praise{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,6vw,38px);color:var(--leaf);letter-spacing:-.02em;line-height:1}
.pts{font-size:13px;color:var(--muted)}
.review{border-left:3px solid var(--bad);padding:8px 0 8px 14px;display:grid;gap:4px}
.review span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--bad);font-weight:600}
.review p{color:var(--text)}

/* Results */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.big div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.big b{display:block;font-family:var(--font-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.big span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cutrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.cutrow .bar{grid-column:1/-1;height:8px}
.cutrow .bar>i{background:var(--leaf)}
details{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:500;font-size:14px}
details p{margin-top:8px;font-size:14px}
details .ans{color:var(--leaf);font-weight:600}
.refs{display:grid;gap:8px;padding:0;list-style:none;color:var(--text);font-size:14px}
.refs li{padding-left:2em;text-indent:-2em}
.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<div class="wrap">
  <header class="hud">
    <div class="brand">La Ruta de Oscar <small>Core I</small></div>
    <div class="prog">
      <div class="prog-top"><span id="hudCut"><b>Primer corte</b></span><span id="hudQ">Pregunta 0 de 17</span></div>
      <div class="bar"><i id="hudBar"></i></div>
    </div>
    <div class="stats">
      <div class="hearts" id="hudHearts" aria-label="Corazones"></div>
      <div class="score"><span>Puntos</span><b id="hudScore">0</b></div>
      <button class="ib" id="btnMute" aria-label="Sonido" title="Sonido"></button>
      <button class="ib" id="btnPause" aria-label="Pausa" title="Pausa (P)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    </div>
  </header>
  <div class="stage"><canvas id="cv"></canvas></div>

    <div class="lr">

      <button class="tbtn" data-k="r" aria-label="Derecha"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 5l8 7-8 7z"/></svg></button>
    </div>
    <button class="tbtn jump" data-k="j" aria-label="Saltar">Saltar</button>
  </div>
  <div class="hint"><kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd> para caminar · <kbd>Espacio</kbd> para saltar (mantén para saltar más alto) · <kbd>P</kbd> pausa · Respuestas con <kbd>A</kbd>–<kbd>D</kbd> o <kbd>1</kbd>–<kbd>4</kbd></div>
</div>
<div class="overlay" id="overlay"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
'use strict';
const DATA={"qs": [{"n": 1, "cut": 1, "q": "Oscar camina hacia la casa de Paloma “porque estaba decidido y cuando se toma una decisión hay que seguir hasta el final” (Moore Fitzgerald, 2014, p. 110). ¿Qué capacidad de la vida humana muestra, y que no tienen las plantas ni los animales?", "opts": ["Nutrición y crecimiento", "Conducta instintiva", "Voluntad y acción libre", "Conocimiento sensible"], "ans": 2, "fail": "La nutrición y el crecimiento también los tienen las plantas, y el instinto y el conocimiento sensible son de la vida sensitiva. Oscar evalúa y elige, y eso es voluntad."}, {"n": 2, "cut": 1, "q": "En El estudiante, el envejecimiento de Chano y sus amigos al inicio de la película es un ejemplo de la dimensión:", "opts": ["Espiritual", "Biológica", "Psicológica y afectiva", "Trascendente"], "ans": 1, "fail": "La dimensión biológica es la física, con el cuerpo y sus necesidades básicas. El cuerpo que envejece pertenece a ella. Fuente: Girault (2009), escenas iniciales."}, {"n": 3, "cut": 1, "q": "Oscar le ofrece una tarta a un desconocido: “He hecho esto para usted” (Moore Fitzgerald, 2014, p. 28). ¿Qué fin de la persona se ve?", "opts": ["Autodeterminación", "Trascender", "Servir", "Ser feliz solo"], "ans": 2, "fail": "Servir es hacer algo concreto por otros sin esperar nada a cambio. Las tartas lo muestran, porque no se quedan en la intención."}, {"n": 4, "cut": 1, "q": "Stevie dice “no soy un inválido” y le pide a Oscar que no lo convierta en su “triste secreto” (Moore Fitzgerald, 2014, p. 113). ¿Qué dignidad reclama?", "opts": ["Moral, porque se gana con las virtudes", "Ontológica, porque vale por ser persona", "Social, porque depende de que el grupo lo acepte", "Ninguna, porque su discapacidad la reduce"], "ans": 1, "fail": "La dignidad ontológica es el valor propio de toda persona. No depende de la discapacidad ni de lo que opinen los demás."}, {"n": 5, "cut": 1, "q": "La Ratio de Paloma divide a la gente en alfa, invisibles, frikis y un “pringado”. Barney dice que “una cosa como la Ratio solo existía si la gente creía en ella” (Moore Fitzgerald, 2014, p. 69). ¿Con qué propiedad de la persona choca?", "opts": ["Libertad", "Trascendencia", "Autoestima", "Igualdad"], "ans": 3, "fail": "La igualdad dice que todos tienen la misma dignidad esencial como seres racionales y libres. La Ratio pone a unos por encima de otros."}, {"n": 6, "cut": 1, "q": "Chano decide estudiar en la universidad siendo mayor. Según la clase, la libertad es:", "opts": ["Hacer lo que uno quiera sin consecuencias", "La capacidad de autodeterminarse ante las alternativas que se ofrecen", "Seguir lo que decide el grupo", "Satisfacer cada deseo"], "ans": 1, "fail": "Libertad no es hacer lo que se quiera, es elegir el bien con responsabilidad. Fuente: Girault (2009)."}, {"n": 7, "cut": 1, "q": "Cuando Oscar la enfrenta, Paloma responde que “alguien tenía que hacerte ver ciertas cosas sobre ti mismo” (Moore Fitzgerald, 2014, p. 111). Su uso de la libertad es:", "opts": ["Libre albedrío responsable", "Aceptación", "Libertinaje", "Autodeterminación"], "ans": 2, "fail": "El libre albedrío es poder elegir, y el libertinaje es abusar de esa libertad con irrespeto hacia el otro. Paloma cambió una carta y dañó a Oscar (p. 99)."}, {"n": 8, "cut": 1, "q": "Chano sigue adelante con su proyecto después de la muerte de Alicia. Eso es un ejemplo de:", "opts": ["Uso de la aceptación, de lo que no se puede cambiar", "Libertinaje", "Uso de la elección sin renuncia", "Control de pulsiones"], "ans": 0, "fail": "Aceptar es asumir lo que no se puede cambiar, como el sufrimiento y la muerte, y seguir adelante. Fuente: Girault (2009), final de la película."}, {"n": 9, "cut": 1, "q": "En el Día de Oración, Meg no quiere hablar delante de todos, pero “respiré hondo un par de veces” y decide mantener el tipo por Oscar (Moore Fitzgerald, 2014, p. 8). ¿Qué parte de la rueda de la libertad se ve?", "opts": ["Creatividad", "Liberarse", "Libertinaje", "Control de pulsiones"], "ans": 3, "fail": "El control de pulsiones es el autocontrol: no actuar de inmediato por el impulso. Meg no se va ni se queda callada."}, {"n": 10, "cut": 1, "q": "Oscar hace tartas que cambian el ánimo de quien las prueba (“Aquella noche hice cuatro tartas”, Moore Fitzgerald, 2014, p. 51). En la rueda de la libertad, esto es:", "opts": ["Deseo", "Creatividad", "Decisión", "Control de pulsiones"], "ans": 1, "fail": "La creatividad es generar algo nuevo que abre un campo de acción. El deseo es solo la necesidad inicial."}, {"n": 11, "cut": 1, "q": "Meg y Stevie no dan por perdido a Oscar y lo buscan: Meg pide ayuda para encontrarlo cuando todos lo dan por perdido (Moore Fitzgerald, 2014, p. 73). ¿Qué fin de la persona se ve?", "opts": ["Servir", "Trascender", "Amar", "Autodeterminarse"], "ans": 2, "fail": "Amar es querer el bien del otro y sostener la esperanza por él."}, {"n": 12, "cut": 1, "q": "Barney acoge a Oscar sin decir muchas cosas: “Tengo todo el tiempo del mundo” (Moore Fitzgerald, 2014, p. 67). ¿Qué fin se ve en Oscar?", "opts": ["Encontrar sentido a la vida", "Ser feliz", "Servir", "Amar"], "ans": 0, "fail": "Esa acogida le devuelve a Oscar una razón para seguir."}, {"n": 13, "cut": 1, "q": "En “El estudiante”, la muerte de Alicia deja huella en Chano y en sus amigos, y Alejandra le pone su nombre a su hija (Girault, 2009). ¿Qué fin se ve?", "opts": ["Ser feliz", "Servir", "Autodeterminarse", "Trascender"], "ans": 3, "fail": "Trascender es dejar huella y legado en otros."}, {"n": 14, "cut": 1, "q": "El padre de Oscar se hunde en el “silencio gris” y no saluda a nadie (Moore Fitzgerald, 2014, p. 81). ¿Qué dimensión de la persona se ve más afectada?", "opts": ["Biológica", "Psicológica y afectiva", "Espiritual", "Ninguna"], "ans": 1, "fail": "Esa dimensión incluye emociones y sentimientos, y aquí está el duelo."}, {"n": 15, "cut": 1, "q": "En “El estudiante”, Alejandra decide tener a su hija aunque otro personaje le propone abortar (Girault, 2009). Eso muestra:", "opts": ["Libre albedrío: elegir por reflexión propia", "Libertinaje", "Deseo sin control", "Obediencia al grupo"], "ans": 0, "fail": "El libre albedrío es el poder de elegir y ser dueño del propio destino. El libertinaje abusaría de esa libertad."}, {"n": 16, "cut": 1, "q": "Oscar decide volver y contar la verdad, “estaba decidido” (Moore Fitzgerald, 2014, p. 110), y renuncia a seguir escondido. ¿Qué uso de la libertad es?", "opts": ["Aceptación", "Libertinaje", "Elección", "Deseo"], "ans": 2, "fail": "Toda elección implica una renuncia y consecuencias, y Oscar las asume."}, {"n": 17, "cut": 1, "q": "¿Cuál es el orden de la rueda de la libertad, desde el centro?", "opts": ["Decisión, deseo, creatividad, libertad", "Deseo, creatividad, decisión, liberarse", "Libertad, deseo, decisión, decisiones", "Deseo, decisión, decisiones, creatividad, libertad, liberarse"], "ans": 3, "fail": "Primero está la necesidad, luego la decisión con inteligencia, después decisiones que abren camino, creatividad, libertad (coherencia) y liberarse (disponerse hacia otros)."}, {"n": 18, "cut": 2, "q": "En Wonder, Summer se sienta a almorzar con Auggie en el comedor, sin que nadie se lo pida. ¿Qué manifestación de la identidad se ve?", "opts": ["Autenticidad como ideal moral", "Dimensión dinámica de la autenticidad", "Autenticidad como referente personal en acción", "Identidad como reconocimiento"], "ans": 3, "fail": "El reconocimiento es ver al otro como persona con identidad. Cuando falta, baja la autoestima. Fuente: Chbosky (2017), escena del comedor."}, {"n": 19, "cut": 2, "q": "Al final del libro Oscar sigue siendo el chico de las tartas, pero ya no esconde su secreto (Moore Fitzgerald, 2014, pp. 110-113). ¿Qué manifestación se ve?", "opts": ["Identidad como reconocimiento", "Dimensión dinámica de la autenticidad", "Autenticidad como ideal moral", "Segmento del trabajo o estudio"], "ans": 1, "fail": "La identidad se mantiene y a la vez madura. Oscar es el mismo, pero ya no es el let actx=null,muted=false;
function tone(f,d=.1,type='square',v=.045,f2,delay=0){
  if(muted)return;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+d+.02);
  }catch(e){}
}

function buildLevel(ci,n){
  const r=rng(1000+ci*77+3);
  const L={pits:[],spikes:[],enemies:[],plats:[],apples:[],pies:[],gates:[],flags:[],goalX:0,worldW:0,stars:[]};
  const rr=(a,b)=>a+Math.floor(r()*(b-a+1));
  const minGap=[200,185,170][ci], pitMax=[100,112,122][ci];
  let x=440;
  for(let i=0;i<n;i++){
    let nh;
    if(i===0)nh=1;
    else if(ci===0)nh=(i>=5&&r()<.5)?2:1;
    else if(ci===1)nh=r()<.5?1:2;
    else nh=r()<.35?3:2;
    let cursor=x;
    for(let h=0;h<nh;h++){
      cursor+=rr(minGap,minGap+80);
      const t=r(); let hw;
      if(t<.36){
        const w=rr(70,pitMax); L.pits.push({x:cursor,w}); hw=w;
        if(ci<2&&r()<.55)L.plats.push({x:cursor+w/2-55,y:GROUND-88,w:110});
      }else if(t<.74){
        const range=rr(150,200), sp=[.8,1.1,1.45][ci]+r()*.35;
        L.enemies.push({x:cursor,a:cursor,b:cursor+range,dir:1,w:34,h:28,speed:sp,dead:0}); hw=range+34;
      }else{
        const w=18*rr(3,4); L.spikes.push({x:cursor,w,h:18}); hw=w;
      }
      for(let k=0;k<4;k++){
        const u=k/3;
        L.apples.push({x:cursor+(hw*.1)+u*(hw*.8),y:GROUND-62-Math.sin(u*Math.PI)*60,taken:0});
      }
      cursor+=hw;
    }
    const gx=cursor+rr(250,300);
    const pieEvery=[4,3,3][ci];
    if((i+1)%pieEvery===0&&i<n-1){
      const px=cursor+110;
      L.plats.push({x:px,y:GROUND-100,w:100});
      L.pies.push({x:px+50,y:GROUND-128,taken:0});
      L.apples.push({x:px+20,y:GROUND-124,taken:0},{x:px+80,y:GROUND-124,taken:0});
    }
    L.gates.push({x:gx,w:44,h:132,i,open:false,anim:0,asked:false});
    if((i+1)%5===0&&i<n-1)L.flags.push({x:gx+100,idx:i+1});
    x=gx+250;
  }
  L.goalX=x+80; L.worldW=L.goalX+520;
  const sr=rng(55+ci);
  for(let i=0;i<70;i++)L.stars.push({x:sr()*W,y:sr()*(GROUND-120),r:sr()<.2?2.4:1.4,p:sr()*6});
  return L;
}

  if(fromCp&&G.cp.idx>0){
    const idx=G.cp.idx;
    for(let i=0;i<idx;i++){const g=G.lvl.gates[i];g.open=true;g.anim=1;g.asked=true}
    sx=G.lvl.gates[idx-1].x+130;
    G.score=G.cp.score;
  }else{G.cp={idx:0,score:G.score}}
  spawnPlayer(sx);
  keys.l=keys.r=keys.j=false;
  updateHUD();
}

function cutStats(ci){

  const verdict=pct>=85?'Dominas Core I. Tu autoconocimiento y tus conceptos están sólidos.':pct>=65?'Vas bien. Repasa las preguntas de abajo y quedarás listo.':'Hay temas por reforzar. Repasa las explicaciones de abajo y vuelve a intentarlo.';

/* ---------- Question ---------- */
function askQuestion(g){
  state='question';sfx.gate();
  keys.l=keys.r=keys.j=false;
  const q=g.q,idxs=shuffle([0,1,2,3]);
  G.cur={q,g,idxs,answered:false,t0:performance.now()};
  const n=G.lvl.gates.length;
  showCard(`
    <div class="qtop"><span class="kicker">${CUTS[G.cut].name} · Pregunta ${g.i+1} de ${n}</span><span class="pts">Respuesta rápida suma hasta +50</span></div>
    <div class="tbar"><i id="tfill"></i></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts" id="opts">${idxs.map((oi,k)=>`<button class="opt" data-act="ans" data-k="${k}"><span class="l">${LET[k]}</span><span>${esc(q.opts[oi])}</span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>`);
  const tf=$('#tfill');tf.style.transition='transform 25s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>{tf.style.transform='scaleX(0)'}));
}
function answer(k){
  const c=G.cur;if(!c||c.answered)return;
  c.answered=true;
  const ok=c.idxs[k]===c.q.ans;
  const el=(performance.now()-c.t0)/1000;
  const tf=$('#tfill');if(tf){tf.style.transition='none'}
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(c.idxs[i]===c.q.ans)b.classList.add('ok');
    else if(i===k)b.classList.add('no');
  });
  if(!G.results[c.q.n])G.results[c.q.n]={ok,cut:G.cut};
  let html;
  if(ok){
    G.streak++;
    const bonus=Math.max(0,Math.round(50*(1-el/25))),sb=Math.min(50,(G.streak-1)*10),gain=100+bonus+sb;
    G.score+=gain;sfx.ok();
    html=`<div class="praise">${PRAISE[Math.floor(Math.random()*PRAISE.length)]}</div><div class="pts">+${gain} puntos${G.streak>1?` · racha de ${G.streak}`:''}</div>`;
  }else{
    G.streak=0;G.hearts=Math.max(0,G.hearts-1);sfx.bad();
    html=`<div class="review"><span>Para repasar</span><p>${esc(c.q.fail)}</p></div>`;
  }
  updateHUD();
  $('#fb').innerHTML=html+`<div class="row"><button class="btn pri" data-act="cont" data-focus>Continuar</button></div>`;
  $('#fb .btn').focus({preventScroll:true});
  $('#fb').scrollIntoView({block:'nearest'});
}
function continueAfter(){
  const g=G.cur.g;G.cur=null;g.open=true;g.asked=true;
  const idx=g.i+1;
  if(idx%5===0&&idx<G.lvl.gates.length)G.cp={idx,score:G.score};
  hideCard();updateHUD();
  if(G.hearts<=0){overCard();return}
  state='play';
}

/* ---------- Gameplay ---------- */
function hurt(dir){
  const p=G.p;if(p.inv>0)return;
  G.hearts--;p.inv=100;p.vy=-7;p.vx=dir*4.5;p.onGround=false;sfx.hurt();G.streak=0;
  float(p.x,p.y-8,'-1','#ff7a7a');updateHUD();
  if(G.hearts<=0){state='over-wait';setTimeout(()=>{if(state==='over-wait')overCard()},450)}
}
function float(x,y,text,color){G.floaters.push({x,y,text,color,t:0})}
function supported(cx){return!G.lvl.pits.some(pt=>cx>pt.x&&cx<pt.x+pt.w)}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function step(){
  if(state==='over-wait'){G.p.vy+=GRAV;G.p.y+=G.p.vy;return}
  if(state!=='play')return;
  const p=G.p,L=G.lvl;
  const dir=(keys.r?1:0)-(keys.l?1:0);
  p.vx+=(dir*SPEED-p.vx)*(p.onGround?.3:.18);
  if(dir)p.face=dir;
  p.prevFeet=p.y+p.h;
  p.x+=p.vx;if(p.x<0){p.x=0;p.vx=0}
  for(const g of L.gates){
    if(!g.open){
      if(p.x+p.w>g.x-6){p.x=g.x-6-p.w;p.vx=0}
      if(!g.asked&&p.x+p.w>g.x-90&&p.onGround!==undefined){g.asked=true;updateHUD();askQuestion(g);return}
      break;
    }
  }
  if(p.onGround)p.coyote=7;else p.coyote--;
  if(p.buffer>0)p.buffer--;
  if(p.buffer>0&&p.coyote>0){p.vy=JUMP;p.onGround=false;p.coyote=0;p.buffer=0;sfx.jump()}
  if(!keys.j&&p.vy<-4.5)p.vy=-4.5;
  p.vy=Math.min(p.vy+GRAV,14);p.y+=p.vy;p.onGround=false;
  const feet=p.y+p.h,cx=p.x+p.w/2;
  if(p.vy>=0){
    if(feet>=GROUND&&p.prevFeet<=GROUND+8&&supported(cx)){p.y=GROUND-p.h;p.vy=0;p.onGround=true}
    else for(const pl of L.plats){
      if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.prevFeet<=pl.y+2&&feet>=pl.y){p.y=pl.y-p.h;p.vy=0;p.onGround=true;break}
    }
  }
  if(p.onGround&&p.y+p.h===GROUND){
    const near=L.pits.some(pt=>cx>pt.x-50&&cx<pt.x+pt.w+50)||L.spikes.some(s=>cx>s.x-40&&cx<s.x+s.w+40)||L.enemies.some(e=>!e.dead&&cx>e.a-50&&cx<e.b+e.w+50);
    if(!near)p.safeX=p.x;
  }
  if(p.inv>0)p.inv--;
  p.anim+=Math.abs(p.vx)*.06;
  const box={x:p.x+5,y:p.y+4,w:p.w-10,h:p.h-4};
  for(const s of L.spikes){if(hit(box,{x:s.x+3,y:GROUND-s.h+5,w:s.w-6,h:s.h-5}))hurt(p.vx>=0?-1:1)}
  for(const e of L.enemies){
    if(e.dead){e.dead++;continue}
    e.x+=e.dir*e.speed;
    if(e.x<=e.a){e.x=e.a;e.dir=1}else if(e.x>=e.b){e.x=e.b;e.dir=-1}
    if(hit(box,{x:e.x+3,y:GROUND-e.h,w:e.w-6,h:e.h})){
      if(p.vy>0&&p.prevFeet<=GROUND-e.h+12){e.dead=1;p.vy=-9;p.buffer=0;G.score+=25;sfx.stomp();float(e.x,GROUND-50,'+25','#ffc46b');updateHUD()}
      else hurt(p.x+p.w/2<e.x+e.w/2?-1:1);
    }
  }
  for(const a of L.apples){
    if(!a.taken&&Math.hypot(cx-a.x,p.y+p.h/2-a.y)<26){a.taken=1;G.score+=10;sfx.coin();float(a.x,a.y-12,'+10','#ffc46b');updateHUD()}
  }
  for(const pi of L.pies){
    if(!pi.taken&&Math.hypot(cx-pi.x,p.y+p.h/2-pi.y)<32){
      pi.taken=1;
      if(G.hearts<3){G.hearts++;float(pi.x,pi.y-16,'+1 corazón','#5ed592')}else{G.score+=50;float(pi.x,pi.y-16,'+50','#ffc46b')}
      sfx.heal();updateHUD();
    }
  }
  for(const g of L.gates)if(g.open&&g.anim<1)g.anim+=.04;
  if(p.y>H+60){
    G.hearts--;G.streak=0;sfx.hurt();updateHUD();
    if(G.hearts<=0){overCard();return}
    p.x=p.safeX;p.y=GROUND-p.h;p.vx=0;p.vy=0;p.inv=100;p.onGround=true;
    G.camX=clamp(p.x-340,0,L.worldW-W);
  }
  if(p.x>L.goalX){doneCard();return}
  const tx=clamp(p.x-340,0,L.worldW-W);
  G.camX+=(tx-G.camX)*.12;
  for(const f of G.floaters)f.t++;
  G.floaters=G.floaters.filter(f=>f.t<50);
}

/* ---------- Drawing ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||W;
  const s=w*dpr/W;cv.width=Math.round(W*s);cv.height=Math.round(H*s);ctx.setTransform(s,0,0,s,0,0);
}
new ResizeObserver(resize).observe(cv);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function hills(color,par,base,amp,freq,ph,cam){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+8;x+=8){
    const u=(x+cam*par)*freq+ph;
    ctx.lineTo(x,base+Math.sin(u)*amp+Math.sin(u*2.3+1)*amp*.4);
  }
  ctx.lineTo(W+8,H);ctx.closePath();ctx.fill();
}
function drawBG(C,cam,t){
  const g=ctx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,C.sky[0]);g.addColorStop(.6,C.sky[1]);g.addColorStop(1,C.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(C.stars){ctx.fillStyle='#fff';for(const s of G.lvl.stars){ctx.globalAlpha=.35+.45*(.5+.5*Math.sin(t*2+s.p));ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1}
  const o=C.orb;
  const og=ctx.createRadialGradient(o.x,o.y,o.r*.4,o.x,o.y,o.r*3);
  og.addColorStop(0,'rgba(255,240,200,.35)');og.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=og;ctx.fillRect(o.x-o.r*3,o.y-o.r*3,o.r*6,o.r*6);
  ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
  hills(C.far,.12,GROUND-130,34,.0042,0,cam);
  hills(C.mid,.28,GROUND-70,26,.0061,2,cam);
  // trees
  const par=.55,sp=330;
  for(let k=Math.floor(cam*par/sp)-1;k<=Math.floor((cam*par+W)/sp)+1;k++){
    const hsh=Math.abs(Math.sin(k*91.7))*60;
    const tx=k*sp+hsh-cam*par;
    ctx.fillStyle='#2a2046';ctx.fillRect(tx-5,GROUND-62,10,64);
    ctx.fillStyle=C.tree;ctx.beginPath();ctx.arc(tx,GROUND-84,38,0,7);ctx.arc(tx-26,GROUND-64,24,0,7);ctx.arc(tx+26,GROUND-64,24,0,7);ctx.fill();
    ctx.fillStyle='#ff5d52';
    for(let a=0;a<5;a++){ctx.beginPath();ctx.arc(tx+Math.cos(a*2.3+k)*26,GROUND-80+Math.sin(a*1.9+k)*22,4,0,7);ctx.fill()}
  }
}
function drawGround(C,cam){
  const L=G.lvl;let sx=cam-10;const ex=cam+W+10;
  const pits=L.pits.filter(p=>p.x+p.w>sx&&p.x<ex).sort((a,b)=>a.x-b.x);
  const segs=[];let cur=sx;
  for(const p of pits){if(p.x>cur)segs.push([cur,p.x]);cur=Math.max(cur,p.x+p.w)}
  if(cur<ex)segs.push([cur,ex]);
  for(const [a,b] of segs){
    ctx.fillStyle=C.dirt;ctx.fillRect(a,GROUND,b-a,H-GROUND);
    ctx.fillStyle=C.grass;ctx.fillRect(a,GROUND,b-a,12);
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(a,GROUND,b-a,3);
  }
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let x=Math.floor(sx/70)*70;x<ex;x+=70){ctx.fillRect(x,GROUND+34+(x/70%3)*18,28,4)}
}
function drawPlat(pl){
  ctx.fillStyle='#8a5a34';rr(pl.x,pl.y,pl.w,14,5);ctx.fill();
  ctx.fillStyle='#d49a58';rr(pl.x,pl.y,pl.w,6,3);ctx.fill();
}
function drawSpikes(s){
  const n=Math.round(s.w/18);
  ctx.fillStyle='#c9c4f2';
  for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(s.x+i*18,GROUND);ctx.lineTo(s.x+i*18+9,GROUND-s.h);ctx.lineTo(s.x+i*18+18,GROUND);ctx.fill()}
  ctx.fillStyle='rgba(0,0,0,.25)';
  for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(s.x+i*18+9,GROUND-s.h);ctx.lineTo(s.x+i*18+18,GROUND);ctx.lineTo(s.x+i*18+9,GROUND);ctx.fill()}
}
function drawEnemy(e,t){
  if(e.dead>18)return;
  const sq=e.dead?Math.max(.2,1-e.dead/12):1,bob=e.dead?0:Math.sin(t*6+e.x)*1.5;
  const cx=e.x+e.w/2,by=GROUND;
  ctx.save();ctx.translate(cx,by);ctx.scale(1,sq);
  ctx.fillStyle='#8883b8';
  ctx.beginPath();ctx.moveTo(-18,0);ctx.bezierCurveTo(-22,-26,-8,-34+bob,0,-30+bob);ctx.bezierCurveTo(10,-34+bob,22,-26,18,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#6c679c';ctx.beginPath();ctx.ellipse(0,0,18,4,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-15,4,0,7);ctx.arc(6,-15,4,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-6+e.dir*1.5,-14,2,0,7);ctx.arc(6+e.dir*1.5,-14,2,0,7);ctx.fill();
  ctx.strokeStyle='#3d3868';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-23);ctx.lineTo(-3,-20);ctx.moveTo(10,-23);ctx.lineTo(3,-20);ctx.stroke();
  ctx.restore();
}
function drawApple(a,t){
  const y=a.y+Math.sin(t*4+a.x*.05)*2.5;
  ctx.fillStyle='#ff5d52';ctx.beginPath();ctx.arc(a.x-3,y,7,0,7);ctx.arc(a.x+3,y,7,0,7);ctx.fill();
  ctx.fillStyle='#5ed592';ctx.beginPath();ctx.ellipse(a.x+3,y-9,5,2.6,-.6,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(a.x-5,y-2,2,0,7);ctx.fill();
}
function drawPie(pi,t){
  const y=pi.y+Math.sin(t*3)*3;
  const gl=ctx.createRadialGradient(pi.x,y,4,pi.x,y,34);gl.addColorStop(0,'rgba(255,196,107,.5)');gl.addColorStop(1,'rgba(255,196,107,0)');
  ctx.fillStyle=gl;ctx.fillRect(pi.x-34,y-34,68,68);
  ctx.fillStyle='#e6b05f';ctx.beginPath();ctx.ellipse(pi.x,y+4,19,9,0,0,7);ctx.fill();
  ctx.fillStyle='#c9843c';ctx.beginPath();ctx.ellipse(pi.x,y,17,10,0,0,7);ctx.fill();
  ctx.strokeStyle='#f2cf8c';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(pi.x-10,y-7);ctx.lineTo(pi.x+10,y+7);ctx.moveTo(pi.x+10,y-7);ctx.lineTo(pi.x-10,y+7);ctx.moveTo(pi.x,y-9);ctx.lineTo(pi.x,y+9);ctx.stroke();
}
function drawGate(g,t){
  const x=g.x,y=GROUND,h=g.h,w=g.w,k=g.open?Math.min(1,g.anim):0;
  ctx.save();
  ctx.fillStyle='#c98a3b';ctx.fillRect(x-8,y-h+16,10,h-16);ctx.fillRect(x+w-2,y-h+16,10,h-16);
  if(k<1){
    ctx.globalAlpha=1-k;
    const gr=ctx.createLinearGradient(0,y-h,0,y);gr.addColorStop(0,'#ffe3a0');gr.addColorStop(1,'#ff9d62');
    ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x+2,y);ctx.lineTo(x+2,y-h+24);ctx.arc(x+w/2,y-h+24,w/2-2,Math.PI,0);ctx.lineTo(x+w-2,y);ctx.closePath();ctx.fill();
    const pu=1+Math.sin(t*5)*.06;
    ctx.fillStyle='#3a1d0b';ctx.font='800 46px "Bricolage Grotesque",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();ctx.translate(x+w/2,y-h/2-6);ctx.scale(pu,pu);ctx.fillText('?',0,0);ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle='#e0a04a';ctx.lineWidth=7;ctx.beginPath();ctx.arc(x+w/2,y-h+24,w/2+3,Math.PI,0);ctx.stroke();
  ctx.fillStyle='#ffc46b';ctx.font='600 12px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText('Pregunta '+(g.i+1),x+w/2,y-h-14);
  ctx.restore();
}
function drawFlag(f){
  const lit=G.cp.idx>=f.idx;
  ctx.fillStyle='#d8d3ff';ctx.fillRect(f.x,GROUND-84,4,84);
  ctx.fillStyle=lit?'#5ed592':'#6c679c';ctx.beginPath();ctx.moveTo(f.x+4,GROUND-84);ctx.lineTo(f.x+44,GROUND-70);ctx.lineTo(f.x+4,GROUND-56);ctx.fill();
}
function drawHouse(L,C){
  const x=L.goalX,y=GROUND;
  ctx.fillStyle='#f2c79a';ctx.fillRect(x,y-110,170,110);
  ctx.fillStyle='#ff5d52';ctx.beginPath();ctx.moveTo(x-16,y-108);ctx.lineTo(x+85,y-190);ctx.lineTo(x+186,y-108);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8a5a34';ctx.fillRect(x+22,y-70,42,70);
  ctx.fillStyle='#ffe9a8';ctx.fillRect(x+98,y-84,44,40);
  ctx.strokeStyle='#8a5a34';ctx.lineWidth=4;ctx.strokeRect(x+98,y-84,44,40);ctx.beginPath();ctx.moveTo(x+120,y-84);ctx.lineTo(x+120,y-44);ctx.stroke();
  ctx.fillStyle='#6a3a2a';ctx.fillRect(x+128,y-200,18,40);
  ctx.fillStyle='#fff';ctx.font='600 14px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(C.goal,x+85,y-208+4);
}
function drawOscar(p,t){
  if(p.inv>0&&Math.floor(p.inv/5)%2===0)return;
  const moving=p.onGround&&Math.abs(p.vx)>.5,sw=moving?Math.sin(p.anim*2)*6:0;
  ctx.save();ctx.translate(p.x+p.w/2,p.y);ctx.scale(p.face,1);
  const air=!p.onGround;
  ctx.fillStyle='#2b2f6b';
  if(air){ctx.fillRect(-9,30,8,9);ctx.fillRect(2,28,8,9)}
  else{ctx.fillRect(-9+sw,30,8,12);ctx.fillRect(2-sw,30,8,12)}
  ctx.fillStyle='#1a1a2e';
  if(air){ctx.fillRect(-10,38,10,5);ctx.fillRect(2,36,10,5)}
  else{ctx.fillRect(-10+sw,41,10,4);ctx.fillRect(2-sw,41,10,4)}
  ctx.fillStyle='#4fa3ff';rr(-11,13,22,19,5);ctx.fill();
  ctx.fillStyle='#3a86dc';ctx.fillRect(-11,26,22,3);
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,8,9,0,7);ctx.fill();
  ctx.fillStyle='#5a3b2a';ctx.beginPath();ctx.arc(0,6,9.5,Math.PI,0);ctx.lineTo(9,6);ctx.lineTo(4,2);ctx.lineTo(-9,6);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(4,8,1.6,0,7);ctx.fill();
  const by=21+(air?-2:0);
  ctx.fillStyle='#f2c9a0';ctx.fillRect(6,by-1,8,5);
  ctx.fillStyle='#e6b05f';ctx.beginPath();ctx.ellipse(15,by+3,9,4,0,0,7);ctx.fill();
  ctx.fillStyle='#c9843c';ctx.beginPath();ctx.ellipse(15,by,8,4.5,0,0,7);ctx.fill();
  ctx.strokeStyle='#f2cf8c';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(10,by-3);ctx.lineTo(20,by+3);ctx.moveTo(20,by-3);ctx.lineTo(10,by+3);ctx.stroke();
  ctx.restore();
}
function draw(){
  if(!G||!G.lvl){ctx.fillStyle='#14122b';ctx.fillRect(0,0,W,H);return}
  const C=CUTS[G.cut],L=G.lvl,cam=G.camX,t=G.t;
  drawBG(C,cam,t);
  ctx.save();ctx.translate(-Math.round(cam),0);
  drawGround(C,cam);
  for(const f of L.flags)drawFlag(f);
  drawHouse(L,C);
  for(const pl of L.plats)drawPlat(pl);
  for(const s of L.spikes)drawSpikes(s);
  for(const g of L.gates)drawGate(g,t);
  for(const e of L.enemies)drawEnemy(e,t);
  for(const a of L.apples)if(!a.taken&&a.x>cam-30&&a.x<cam+W+30)drawApple(a,t);
  for(const pi of L.pies)if(!pi.taken)drawPie(pi,t);
  if(G.p)drawOscar(G.p,t);
  ctx.font='700 18px "Bricolage Grotesque",system-ui,sans-serif';ctx.textAlign='center';
  for(const f of G.floaters){ctx.globalAlpha=1-f.t/50;ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y-f.t*.8)}
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------- Loop ---------- */
window.__steps=1;
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(100,now-last);last=now;
  if(G){
    if(state==='play'||state==='over-wait'){
      acc+=dt;
      while(acc>=1000/60){for(let k=0;k<window.__steps;k++)step();acc-=1000/60}
    }else acc=0;
    G.t+=dt/1000;
  }
  draw();requestAnimationFrame(frame);
}

/* ---------- Input ---------- */
const K={l:['ArrowLeft','a','A'],r:['ArrowRight','d','D'],j:['ArrowUp',' ','w','W']};
function pressJump(){if(!keys.j&&G&&G.p)G.p.buffer=8;keys.j=true}
window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(state==='play'){
    if(K.l.includes(e.key)){keys.l=true;e.preventDefault()}
    else if(K.r.includes(e.key)){keys.r=true;e.preventDefault()}
    else if(K.j.includes(e.key)){pressJump();e.preventDefault()}
    else if(e.key==='p'||e.key==='P'||e.key==='Escape')pauseCard();
  }else if(state==='question'&&G.cur){
    const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
    if(!G.cur.answered&&m!==undefined){answer(m);e.preventDefault()}
    else if(G.cur.answered&&(e.key==='Enter'||e.key===' ')){if(document.activeElement&&document.activeElement.dataset.act==='cont')return;e.preventDefault();continueAfter()}
  }else if(state==='pause'&&(e.key==='p'||e.key==='P'||e.key==='Escape')){hideCard();state='play'}
});
window.addEventListener('keyup',e=>{
  if(K.l.includes(e.key))keys.l=false;
  if(K.r.includes(e.key))keys.r=false;
  if(K.j.includes(e.key))keys.j=false;
});
window.addEventListener('blur',()=>{keys.l=keys.r=keys.j=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseCard()});
document.querySelectorAll('.tbtn').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');if(k==='j')pressJump();else keys[k]=true});
  const up=()=>{b.classList.remove('on');keys[k]=false};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
});
$('#pad').addEventListener('contextmenu',e=>e.preventDefault());

$('#btnMute').addEventListener('click',e=>{muted=!muted;e.currentTarget.innerHTML=iconSound(muted);e.currentTarget.blur()});
$('#btnPause').addEventListener('click',e=>{e.currentTarget.blur();if(state==='play')pauseCard()});

function begin(ci){
  newGame(ci);startCut(ci,false);introCard();
}
card.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='start')begin(0);
  else if(a==='cut')begin(+b.dataset.n);
  else if(a==='go'){hideCard();state='play'}
  else if(a==='resume'){hideCard();state='play'}
  else if(a==='menu'){newGame(0);startCut(0,false);menuCard()}
  else if(a==='retry'){hideCard();startCut(G.cut,true);state='play'}
  else if(a==='next'){const n=G.cut+1,sc=G.score,res=G.results,ord=G.orders;newGame(n);G.score=sc;G.results=res;G.orders=ord;startCut(n,false);G.cp={idx:0,score:sc};introCard()}
  else if(a==='final')finalCard();
  else if(a==='ans')answer(+b.dataset.k);
  else if(a==='cont')continueAfter();
});

/* ---------- Boot ---------- */
newGame(0);startCut(0,false);
window.__game={get G(){return G},keys,get state(){return state}};
menuCard();
resize();
requestAnimationFrame(frame);
})();
</script>
